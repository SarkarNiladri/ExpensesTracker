<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Expense Tracker</title>

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <link rel="manifest" href="/manifest.json?v=6">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --surface-0: #0a0a0a;
            --surface-1: #141414;
            --surface-2: #1a1a1a;
            --text-primary: #f5f5f5;
            --text-secondary: #8a8a8a;
            --text-muted: #5a5a5a;
            --border: rgba(255, 255, 255, 0.08);
            --border-strong: rgba(255, 255, 255, 0.15);
            --fill-accent: #f5f5f5;
            --on-accent: #0a0a0a;
            --radius: 6px;
            --radius-lg: 10px;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --transition: all 0.2s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            overflow-x: hidden;
        }

        body {
            font-family: var(--font-sans);
            background: var(--surface-0);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            font-feature-settings: 'tnum' 1, 'cv11' 1;
        }

        /* ===== App wrapper ===== */
        .app {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 32px 80px;
        }

        /* ===== Top bar ===== */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            padding-bottom: 20px;
            border-bottom: 0.5px solid var(--border);
            margin-bottom: 40px;
            animation: fadeUp 0.5s ease-out;
            flex-wrap: wrap;
        }

        .topbar-left {
            display: flex;
            align-items: baseline;
            gap: 14px;
            min-width: 0;
            flex-wrap: wrap;
        }

        .topbar-left h1 {
            font-size: 20px;
            font-weight: 500;
            color: var(--text-primary);
            letter-spacing: -0.2px;
            margin: 0;
        }

        .topbar-left .month-badge {
            font-size: 13px;
            color: var(--text-secondary);
            letter-spacing: 0.2px;
            font-weight: 400;
            white-space: nowrap;
        }

        .topbar-left .month-badge .dot {
            display: inline-block;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--text-muted);
            margin: 0 8px 2px;
            vertical-align: middle;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .reset-top-btn {
            background: transparent;
            border: 0.5px solid var(--border);
            color: var(--text-secondary);
            font-size: 12px;
            font-family: var(--font-sans);
            padding: 7px 14px;
            border-radius: var(--radius);
            cursor: pointer;
            transition: var(--transition);
            letter-spacing: 0.2px;
            white-space: nowrap;
        }

        .reset-top-btn:hover {
            color: var(--text-primary);
            border-color: var(--border-strong);
            background: var(--surface-1);
        }

        /* ===== Hero ===== */
        .hero {
            margin-bottom: 56px;
            animation: fadeUp 0.5s ease-out 0.05s backwards;
        }

        .hero-main {
            display: flex;
            gap: 40px;
            align-items: flex-start;
            flex-wrap: wrap;
        }

        .hero-total {
            flex: 0 0 auto;
            min-width: 0;
        }

        .hero-total .label {
            font-size: 12px;
            color: var(--text-secondary);
            letter-spacing: 0.6px;
            text-transform: uppercase;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .hero-total .amount {
            font-size: 60px;
            font-weight: 500;
            line-height: 1;
            letter-spacing: -2.5px;
            color: var(--text-primary);
            word-break: break-word;
        }

        .hero-total .amount .currency {
            font-size: 34px;
            font-weight: 400;
            color: var(--text-secondary);
            letter-spacing: -1px;
            margin-right: 2px;
        }

        .hero-stats {
            flex: 1;
            min-width: 260px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding-top: 4px;
        }

        .hero-stats .stat .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            letter-spacing: 0.4px;
        }

        .hero-stats .stat .stat-value {
            font-size: 20px;
            font-weight: 500;
            color: var(--text-primary);
            letter-spacing: -0.5px;
            word-break: break-word;
        }

        /* ===== Section labels ===== */
        .section-label {
            display: block;
            font-size: 12px;
            color: var(--text-secondary);
            letter-spacing: 0.6px;
            text-transform: uppercase;
            font-weight: 500;
            margin-bottom: 18px;
        }

        /* ===== Add section ===== */
        .add-section {
            margin-bottom: 56px;
            padding-bottom: 40px;
            border-bottom: 0.5px solid var(--border);
            animation: fadeUp 0.5s ease-out 0.1s backwards;
        }

        .add-grid {
            display: grid;
            grid-template-columns: 1.2fr 1.2fr 1.1fr 2fr auto;
            gap: 12px;
            align-items: flex-end;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        .field input,
        .field select {
            padding: 12px 14px;
            border-radius: var(--radius);
            border: 0.5px solid var(--border);
            background: var(--surface-1);
            color: var(--text-primary);
            font-size: 14px;
            font-family: var(--font-sans);
            outline: none;
            transition: var(--transition);
            font-weight: 400;
            width: 100%;
        }

        .field input::placeholder {
            color: var(--text-muted);
        }

        .field input:focus,
        .field select:focus {
            border-color: var(--border-strong);
            background: var(--surface-2);
        }

        .field select {
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238a8a8a' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 14px;
            padding-right: 34px;
        }

        .field select option {
            background: var(--surface-2);
            color: var(--text-primary);
        }

        .add-btn {
            padding: 12px 22px;
            border-radius: var(--radius);
            border: none;
            background: var(--fill-accent);
            color: var(--on-accent);
            font-size: 14px;
            font-weight: 500;
            font-family: var(--font-sans);
            cursor: pointer;
            transition: var(--transition);
            height: 42px;
            white-space: nowrap;
            letter-spacing: 0.1px;
        }

        .add-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .add-btn:active {
            transform: translateY(0);
            opacity: 0.85;
        }

        /* ===== Chart section ===== */
        .chart-section {
            margin-bottom: 56px;
            padding-bottom: 40px;
            border-bottom: 0.5px solid var(--border);
            animation: fadeUp 0.5s ease-out 0.15s backwards;
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .chart-header h2 {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-primary);
            letter-spacing: -0.2px;
        }

        .chart-header .sub {
            font-size: 12px;
            color: var(--text-muted);
        }

        .chart-body {
            display: grid;
            grid-template-columns: 180px 1fr;
            gap: 40px;
            align-items: center;
        }

        .chart-wrap {
            position: relative;
            width: 180px;
            height: 180px;
        }

        .chart-wrap svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .pie-slice {
            transition: opacity 0.2s;
            cursor: pointer;
            animation: sliceIn 0.5s cubic-bezier(0.34, 1.2, 0.64, 1) backwards;
        }

        .pie-slice:hover {
            opacity: 0.75;
        }

        @keyframes sliceIn {
            from { opacity: 0; transform: scale(0.85); transform-origin: 100px 100px; }
            to { opacity: 1; transform: scale(1); transform-origin: 100px 100px; }
        }

        .chart-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
        }

        .chart-center .center-label {
            font-size: 10px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .chart-center .center-value {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-primary);
            margin-top: 4px;
            letter-spacing: -0.5px;
        }

        .chart-legend {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }

        .legend-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
            border-bottom: 0.5px solid var(--border);
        }

        .legend-item:last-child {
            border-bottom: none;
        }

        .legend-left {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            flex: 1;
        }

        .legend-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .legend-name {
            font-size: 13px;
            font-weight: 400;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .legend-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .legend-amount {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
            letter-spacing: -0.2px;
        }

        .legend-pct {
            font-size: 12px;
            color: var(--text-muted);
            min-width: 42px;
            text-align: right;
            font-feature-settings: 'tnum' 1;
        }

        .chart-empty {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-size: 13px;
        }

        /* ===== Filters ===== */
        .filters {
            display: flex;
            gap: 28px;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 0.5px solid var(--border);
            align-items: center;
            flex-wrap: wrap;
            animation: fadeUp 0.5s ease-out 0.2s backwards;
        }

        .filters .filter-select {
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--border);
            color: var(--text-primary);
            font-size: 13px;
            font-family: var(--font-sans);
            padding: 6px 18px 6px 0;
            cursor: pointer;
            outline: none;
            appearance: none;
            -webkit-appearance: none;
            transition: var(--transition);
            letter-spacing: 0.1px;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238a8a8a' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 0 center;
            background-size: 12px;
        }

        .filters .filter-select:hover {
            border-color: var(--text-secondary);
        }

        .filters .filter-select:focus {
            border-color: var(--text-primary);
        }

        .filters .filter-select option {
            background: var(--surface-2);
            color: var(--text-primary);
        }

        .filters .reset-btn {
            margin-left: auto;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 12px;
            font-family: var(--font-sans);
            cursor: pointer;
            padding: 6px 0;
            transition: var(--transition);
            letter-spacing: 0.2px;
        }

        .filters .reset-btn:hover {
            color: var(--text-primary);
        }

        .filters .count {
            font-size: 12px;
            color: var(--text-muted);
            letter-spacing: 0.2px;
        }

        /* ===== Table ===== */
        .table-section {
            animation: fadeUp 0.5s ease-out 0.25s backwards;
        }

        table.expense-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .expense-table thead {
            border-bottom: 1px solid var(--border);
        }

        .expense-table th {
            text-align: left;
            padding: 14px 0;
            font-weight: 500;
            font-size: 11px;
            color: var(--text-secondary);
            letter-spacing: 0.6px;
            text-transform: uppercase;
        }

        .expense-table th.amount-col {
            text-align: right;
        }

        .expense-table th.actions-col {
            text-align: right;
            width: 90px;
        }

        .expense-table td {
            padding: 16px 0;
            color: var(--text-primary);
            border-bottom: 0.5px solid var(--border);
            vertical-align: middle;
            font-weight: 400;
        }

        .expense-table tr:last-child td {
            border-bottom: none;
        }

        .expense-table .date-cell {
            color: var(--text-secondary);
            font-size: 13px;
            white-space: nowrap;
        }

        .expense-table .category-cell {
            white-space: nowrap;
        }

        .expense-table .amount-cell {
            text-align: right;
            font-weight: 500;
            letter-spacing: -0.2px;
            white-space: nowrap;
            font-feature-settings: 'tnum' 1;
        }

        .expense-table .desc-cell {
            color: var(--text-secondary);
            font-size: 13px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 240px;
        }

        .expense-table .actions-cell {
            text-align: right;
            white-space: nowrap;
        }

        .expense-table .action-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 14px;
            cursor: pointer;
            padding: 6px 8px;
            border-radius: 4px;
            transition: var(--transition);
        }

        .expense-table .action-btn:hover {
            color: var(--text-primary);
            background: var(--surface-1);
        }

        .expense-table .delete-btn:hover {
            color: #ff6b6b;
        }

        .expense-table .empty-row td {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            font-size: 13px;
            border-bottom: none;
        }

        /* ===== Edit Row ===== */
        .edit-row td {
            padding: 14px 0;
            border-bottom: 0.5px solid var(--border);
        }

        .edit-field {
            display: grid;
            grid-template-columns: 1.2fr 1.2fr 1.1fr 2fr auto;
            gap: 12px;
            align-items: center;
        }

        .edit-field input,
        .edit-field select {
            padding: 10px 12px;
            border-radius: var(--radius);
            border: 0.5px solid var(--border);
            background: var(--surface-1);
            color: var(--text-primary);
            font-size: 13px;
            font-family: var(--font-sans);
            outline: none;
            transition: var(--transition);
            width: 100%;
        }

        .edit-field select option {
            background: var(--surface-2);
        }

        .edit-field input:focus,
        .edit-field select:focus {
            border-color: var(--border-strong);
        }

        .edit-actions {
            display: flex;
            gap: 8px;
        }

        .edit-actions button {
            padding: 10px 16px;
            border-radius: var(--radius);
            border: none;
            font-size: 13px;
            font-family: var(--font-sans);
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
        }

        .save-edit-btn {
            background: var(--fill-accent);
            color: var(--on-accent);
        }

        .save-edit-btn:hover {
            opacity: 0.9;
        }

        .cancel-edit-btn {
            background: transparent;
            color: var(--text-secondary);
            border: 0.5px solid var(--border) !important;
        }

        .cancel-edit-btn:hover {
            color: var(--text-primary);
            border-color: var(--border-strong) !important;
        }

        /* ===== Pagination ===== */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 24px;
            padding: 32px 0 8px;
            margin-top: 8px;
            border-top: 0.5px solid var(--border);
        }

        .page-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 13px;
            font-family: var(--font-sans);
            cursor: pointer;
            padding: 8px 0;
            transition: var(--transition);
            letter-spacing: 0.2px;
        }

        .page-btn:hover:not(:disabled) {
            color: var(--text-primary);
        }

        .page-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .page-info {
            font-size: 13px;
            color: var(--text-muted);
            letter-spacing: 0.2px;
            font-feature-settings: 'tnum' 1;
        }

        /* ===== Footer ===== */
        .footer {
            margin-top: 40px;
            padding-top: 24px;
            border-top: 0.5px solid var(--border);
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            letter-spacing: 0.2px;
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%) translateY(120px);
            background: var(--surface-2);
            color: var(--text-primary);
            padding: 14px 24px;
            border-radius: var(--radius);
            font-size: 13px;
            font-weight: 400;
            border: 0.5px solid var(--border-strong);
            opacity: 0;
            transition: 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            pointer-events: none;
            z-index: 999;
            font-family: var(--font-sans);
            max-width: calc(100vw - 32px);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.success {
            border-color: rgba(100, 200, 120, 0.4);
        }

        .toast.error {
            border-color: rgba(255, 107, 107, 0.4);
        }

        /* ===== Animations ===== */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===================================================== */
        /* ===== RESPONSIVE + MOBILE REFINEMENTS ============== */
        /* ===================================================== */

        @media (max-width: 768px) {
            .app {
                padding: 28px 20px 60px;
            }

            .topbar {
                margin-bottom: 32px;
                padding-bottom: 16px;
            }

            .topbar-left h1 {
                font-size: 15px;
            }

            .topbar-left .month-badge {
                font-size: 12px;
            }

            .hero {
                margin-bottom: 40px;
            }

            .hero-main {
                gap: 28px;
            }

            .hero-total .amount {
                font-size: 44px;
                letter-spacing: -1.8px;
            }

            .hero-total .amount .currency {
                font-size: 24px;
            }

            .hero-stats {
                min-width: 100%;
                gap: 16px;
            }

            .hero-stats .stat .stat-value {
                font-size: 17px;
            }

            .add-section,
            .chart-section {
                margin-bottom: 40px;
                padding-bottom: 32px;
            }

            .add-grid {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }

            .add-grid .field:nth-child(4) {
                grid-column: span 2;
            }

            .add-btn {
                grid-column: span 2;
                width: 100%;
                height: 46px;
            }

            .chart-body {
                grid-template-columns: 1fr;
                gap: 24px;
            }

            .chart-wrap {
                width: 160px;
                height: 160px;
                margin: 0 auto;
            }

            .filters {
                gap: 18px;
                row-gap: 14px;
            }

            .filters .reset-btn {
                margin-left: 0;
            }

            .filters .count {
                margin-left: auto;
            }

            .expense-table th {
                font-size: 10px;
                padding: 12px 0;
            }

            .expense-table td {
                padding: 14px 0;
                font-size: 13px;
            }

            .expense-table .date-cell {
                font-size: 12px;
            }

            .expense-table .desc-cell {
                max-width: 100px;
                font-size: 12px;
            }

            .expense-table .amount-cell {
                font-size: 13px;
            }

            .expense-table th.actions-col,
            .expense-table .actions-cell {
                width: 80px;
            }

            .expense-table .action-btn {
                font-size: 16px;
                padding: 10px 12px;
                min-width: 40px;
                min-height: 40px;
                display: inline-flex;
                align-items: center;
                justify-content: center;
            }

            .field input,
            .field select,
            .edit-field input,
            .edit-field select {
                font-size: 16px;
            }

            .edit-field {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }

            .edit-field input,
            .edit-field select {
                padding: 10px 12px;
            }

            .edit-actions {
                grid-column: span 2;
                justify-content: flex-end;
            }

            .pagination {
                gap: 16px;
                padding: 24px 0 4px;
            }

            .footer {
                margin-top: 32px;
                padding-top: 20px;
            }
        }

        @media (max-width: 480px) {
            .topbar {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .topbar-right {
                width: 100%;
                justify-content: flex-end;
            }

            .topbar-left h1 {
                font-size: 15px;
            }

            .hero-total .amount {

            .hero-stats {

            .hero-stats .stat:nth-child(3) {

        @media (max-width: 380px) {

</head>
<body>

    <div class="app">

        <!-- ===== TOP BAR ===== -->
        <header class="topbar">
            <div class="topbar-left">
                <h1>💰Expense Tracker</h1>
                <span class="month-badge">

                    <span id="currentMonthLabel">January 2026</span>
                </span>
            </div>
            <div class="topbar-right">

        <!-- ===== HERO ===== -->
        <section class="hero">
            <div class="hero-main">
                <div class="hero-total">
                    <div class="label" id="heroLabel">Total</div>
                    <div class="amount">
                        <span class="currency">₹</span><span id="heroAmount">0</span>
                    </div>
                </div>
                <div class="hero-stats">
                    <div class="stat">

                    </div>
                    <div class="stat">
                        <div class="stat-label">Month</div>

                    </div>
                    <div class="stat">

        <!-- ===== ADD EXPENSE ===== -->
        <section class="add-section">

                        <option value="loan">🏦 Loan</option>
                        <option value="travelling">✈️ Travelling</option>
                        <option value="shopping">🛍️ Shopping</option>
                        <option value="entertainment">🎬 Entertainment</option>
                        <option value="utilities">💡 Utilities</option>
                        <option value="healthcare">🏥 Healthcare</option>
                        <option value="education">📚 Education</option>

        <!-- ===== TOP CATEGORIES CHART ===== -->

                    </div>
                </div>
                <div class="chart-legend" id="pieLegend">
                    <div class="chart-empty">No data yet</div>

        <!-- ===== FILTERS ===== -->
        <div class="filters">
            <select id="filterCategory" class="filter-select">
                <option value="all">All categories</option>
                <option value="food">Food</option>
                <option value="grocery">Grocery</option>
                <option value="rent">Rent</option>
                <option value="investment">Investment</option>
                <option value="loan">Loan</option>
                <option value="travelling">Travelling</option>
                <option value="shopping">Shopping</option>
                <option value="entertainment">Entertainment</option>
                <option value="utilities">Utilities</option>
                <option value="healthcare">Healthcare</option>
                <option value="education">Education</option>
                <option value="insurance">Insurance</option>
                <option value="subscription">Subscription</option>
                <option value="other">Other</option>
            </select>
            <select id="filterWeek" class="filter-select">
                <option value="all">All weeks</option>
            </select>
            <select id="filterMonth" class="filter-select">
                <option value="all">All months</option>
            </select>
            <button class="reset-btn" id="clearFiltersBtn">Reset filters</button>
            <span class="count" id="filterStats">0 items</span>
        </div>

        <!-- ===== TABLE ===== -->
        <section class="table-section">
            <table class="expense-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Category</th>
                        <th class="desc-col">Description</th>
                        <th class="amount-col">Amount</th>
                        <th class="actions-col"></th>

                </thead>
                <tbody id="expenseBody">
                    <tr class="empty-row"><td colspan="5">No expenses yet</td></tr>
                </tbody>

        <!-- ===== PAGINATION ===== -->
        <div class="pagination">
            <button class="page-btn" id="prevPageBtn">← Previous</button>
            <span class="page-info" id="pageInfo">1 / 1</span>
            <button class="page-btn" id="nextPageBtn">Next →</button>
        </div>

        <!-- ===== FOOTER ===== -->
        <div class="footer">
            Data saved locally in your browser
        </div>
    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast"></div>

    <script>
        (function() {
            'use strict';

            // ===== CONSTANTS =====
            const CATEGORY_COLORS = {
                food: '#d97757',
                grocery: '#7fa17f',
                rent: '#c9a86a',
                investment: '#8fb87f',
                loan: '#c98a8a',
                travelling: '#7a9bc9',
                shopping: '#c98ab8',
                entertainment: '#d9a86a',
                utilities: '#7fb8bf',
                healthcare: '#c98ab8',
                education: '#b88ab8',
                insurance: '#8ab8d9',
                subscription: '#a88ac9',
                other: '#8a8a8a'
            };

            const CATEGORY_NAMES = {
                food: 'Food', grocery: 'Grocery', rent: 'Rent', investment: 'Investment',
                loan: 'Loan', travelling: 'Travelling', shopping: 'Shopping',
                entertainment: 'Entertainment', utilities: 'Utilities', healthcare: 'Healthcare',
                education: 'Education', insurance: 'Insurance', subscription: 'Subscription', other: 'Other'
            };

            const CATEGORY_EMOJIS = {
                food: '🍔', grocery: '🛒', rent: '🏠', investment: '📈',
                loan: '🏦', travelling: '✈️', shopping: '🛍️',
                entertainment: '🎬', utilities: '💡', healthcare: '🏥',
                education: '📚', insurance: '🛡️', subscription: '📺', other: '📌'
            };

            const STORAGE_KEY = 'expenseTrackerData';
            const ITEMS_PER_PAGE = 10;

            // ===== STATE =====
            let expenses = [];
            let filteredExpenses = [];
            let editingId = null;
            let currentPage = 0;

            // ===== DOM REFS =====
            const form = document.getElementById('expenseForm');
            const amountInput = document.getElementById('amountInput');
            const categorySelect = document.getElementById('categorySelect');
            const dateInput = document.getElementById('dateInput');
            const descInput = document.getElementById('descInput');
            const expenseBody = document.getElementById('expenseBody');
            const heroLabel = document.getElementById('heroLabel');
            const heroAmount = document.getElementById('heroAmount');
            const heroWeek = document.getElementById('heroWeek');
            const heroMonth = document.getElementById('heroMonth');
            const heroAvg = document.getElementById('heroAvg');
            const filterCategory = document.getElementById('filterCategory');
            const filterWeek = document.getElementById('filterWeek');
            const filterMonth = document.getElementById('filterMonth');
            const filterStats = document.getElementById('filterStats');
            const clearFiltersBtn = document.getElementById('clearFiltersBtn');
            const resetBtn = document.getElementById('resetBtn');
            const toast = document.getElementById('toast');
            const prevPageBtn = document.getElementById('prevPageBtn');
            const nextPageBtn = document.getElementById('nextPageBtn');
            const pageInfo = document.getElementById('pageInfo');
            const pieSvg = document.getElementById('pieSvg');
            const pieLegend = document.getElementById('pieLegend');
            const chartTotalValue = document.getElementById('chartTotalValue');
            const currentMonthLabel = document.getElementById('currentMonthLabel');

            // ===== HELPERS =====
            function todayStr() { return new Date().toISOString().slice(0, 10); }

            function formatDate(d) {
                const dt = new Date(d + 'T00:00:00');
                return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            }

            function formatAmount(n, decimals) {
                const options = decimals !== undefined
                    ? { minimumFractionDigits: decimals, maximumFractionDigits: decimals }
                    : { maximumFractionDigits: 0 };
                return n.toLocaleString('en-IN', options);
            }

            function getWeekNumber(d) {
                const date = new Date(d + 'T00:00:00');
                const startOfYear = new Date(date.getFullYear(), 0, 1);
                const days = Math.floor((date - startOfYear) / (24 * 60 * 60 * 1000));
                return Math.ceil((days + startOfYear.getDay() + 1) / 7);
            }

            function getWeekLabelFromKey(weekKey) {
                const parts = weekKey.split('-W');
                const year = parseInt(parts[0]);
                const weekNum = parseInt(parts[1]);
                const jan1 = new Date(year, 0, 1);
                const jan1Day = jan1.getDay();
                let firstMonday = new Date(year, 0, 1);
                const diff = (jan1Day === 0) ? 1 : (8 - jan1Day);
                firstMonday.setDate(1 + diff);
                const monday = new Date(firstMonday);
                monday.setDate(monday.getDate() + (weekNum - 1) * 7);
                return `W${weekNum} · ${monday.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}`;
            }

            function getMonthLabel(d) {
                const date = new Date(d + 'T00:00:00');
                return date.toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
            }

            function getCurrentMonthLabel() {
                const now = new Date();
                return now.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
            }

            function getMonthKey(d) { return d.slice(0, 7); }

            function getWeekKey(d) {
                const date = new Date(d + 'T00:00:00');
                const weekNum = getWeekNumber(d);
                return `${date.getFullYear()}-W${String(weekNum).padStart(2, '0')}`;
            }

            function isSameWeek(d1, d2) { return getWeekKey(d1) === getWeekKey(d2); }
            function isSameMonth(d1, d2) { return getMonthKey(d1) === getMonthKey(d2); }
            function getTodayWeekKey() { return getWeekKey(todayStr()); }
            function getTodayMonthKey() { return getMonthKey(todayStr()); }

            // ===== STORAGE =====
            function loadData() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (raw) {
                        const parsed = JSON.parse(raw);
                        if (Array.isArray(parsed)) {
                            expenses = parsed.filter(e => e.id && e.amount != null && e.category && e.date);
                            return;
                        }
                    }
                } catch (_) {}
                expenses = [];
            }

            function saveData() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(expenses));
                } catch (_) {}
            }

            // ===== CRUD =====
            function addExpense(amount, category, date, description) {
                const id = Date.now() + '_' + Math.random().toString(36).slice(2, 8);
                const expense = {
                    id,
                    amount: parseFloat(amount),
                    category,
                    date,
                    description: description.trim() || '',
                    createdAt: new Date().toISOString()
                };
                expenses.push(expense);
                saveData();
                return expense;
            }

            function deleteExpense(id) {
                expenses = expenses.filter(e => e.id !== id);
                saveData();
            }

            function updateExpense(id, amount, category, date, description) {
                const idx = expenses.findIndex(e => e.id === id);
                if (idx === -1) return false;
                expenses[idx] = { ...expenses[idx], amount: parseFloat(amount), category, date,
                    description: description.trim() || '' };
                saveData();
                return true;
            }

            function resetAll() {
                if (expenses.length === 0) {
                    showToast('Nothing to reset', 'error');
                    return;
                }
                if (confirm('Delete all expenses? This cannot be undone.')) {
                    expenses = [];
                    saveData();
                    currentPage = 0;
                    render();
                    showToast('All expenses cleared', 'success');
                }
            }

            // ===== FILTERING =====
            function getFiltered() {
                let list = [...expenses];
                const cat = filterCategory.value;
                if (cat !== 'all') list = list.filter(e => e.category === cat);
                const weekVal = filterWeek.value;
                if (weekVal !== 'all') list = list.filter(e => getWeekKey(e.date) === weekVal);
                const monthVal = filterMonth.value;
                if (monthVal !== 'all') list = list.filter(e => getMonthKey(e.date) === monthVal);
                list.sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
                return list;
            }

            // ===== PIE CHART =====
            function polarToCartesian(cx, cy, r, angleDeg) {
                const angleRad = (angleDeg - 90) * Math.PI / 180;
                return { x: cx + r * Math.cos(angleRad), y: cy + r * Math.sin(angleRad) };
            }

            function describeDonutSlice(cx, cy, outerR, innerR, startAngle, endAngle) {
                if (endAngle - startAngle >= 359.99) {
                    return `M ${cx - outerR} ${cy} A ${outerR} ${outerR} 0 1 0 ${cx + outerR} ${cy} A ${outerR} ${outerR} 0 1 0 ${cx - outerR} ${cy} M ${cx - innerR} ${cy} A ${innerR} ${innerR} 0 1 0 ${cx + innerR} ${cy} A ${innerR} ${innerR} 0 1 0 ${cx - innerR} ${cy} Z`;
                }
                const start = polarToCartesian(cx, cy, outerR, endAngle);
                const end = polarToCartesian(cx, cy, outerR, startAngle);
                const largeArc = endAngle - startAngle <= 180 ? 0 : 1;
                const startInner = polarToCartesian(cx, cy, innerR, endAngle);
                const endInner = polarToCartesian(cx, cy, innerR, startAngle);

                return [
                    'M', start.x, start.y,
                    'A', outerR, outerR, 0, largeArc, 0, end.x, end.y,
                    'L', endInner.x, endInner.y,
                    'A', innerR, innerR, 0, largeArc, 1, startInner.x, startInner.y,
                    'Z'
                ].join(' ');
            }

            function renderPieChart() {
                const catTotals = {};
                for (const e of filteredExpenses) {
                    catTotals[e.category] = (catTotals[e.category] || 0) + e.amount;
                }

                const sorted = Object.entries(catTotals).sort((a, b) => b[1] - a[1]);
                const top5 = sorted.slice(0, 5);
                const othersTotal = sorted.slice(5).reduce((s, [, amt]) => s + amt, 0);
                if (othersTotal > 0) top5.push(['_others', othersTotal]);

                const grandTotal = top5.reduce((s, [, amt]) => s + amt, 0);

                if (grandTotal === 0) {
                    pieSvg.innerHTML = '';
                    chartTotalValue.textContent = '₹0';
                    pieLegend.innerHTML = '<div class="chart-empty">No data yet</div>';
                    return;
                }

                let svgMarkup = '';
                let legendMarkup = '';
                let currentAngle = 0;
                const cx = 100, cy = 100, outerR = 88, innerR = 60;

                top5.forEach(([cat, amt], idx) => {
                    const pct = (amt / grandTotal) * 100;
                    const sweep = (amt / grandTotal) * 360;
                    const endAngle = currentAngle + sweep;

                    const color = cat === '_others' ? '#5a5a5a' : (CATEGORY_COLORS[cat] || '#5a5a5a');
                    const name = cat === '_others' ? 'Others' : (CATEGORY_NAMES[cat] || cat);
                    const emoji = cat === '_others' ? '' : (CATEGORY_EMOJIS[cat] || '');

                    const path = describeDonutSlice(cx, cy, outerR, innerR, currentAngle, endAngle);

                    svgMarkup += `<path d="${path}" fill="${color}" class="pie-slice"
                        style="animation-delay: ${idx * 0.06}s;"
                        data-cat="${cat}">
                        <title>${name}: ₹${formatAmount(amt)} (${pct.toFixed(1)}%)</title>
                    </path>`;

                    legendMarkup += `
                        <div class="legend-item">
                            <div class="legend-left">
                                <span class="legend-dot" style="background:${color};"></span>
                                <span class="legend-name">${emoji}${emoji ? ' ' : ''}${name}</span>
                            </div>
                            <div class="legend-right">
                                <span class="legend-amount">₹${formatAmount(amt)}</span>
                                <span class="legend-pct">${pct.toFixed(1)}%</span>
                            </div>
                        </div>
                    `;

                    currentAngle = endAngle;
                });

                pieSvg.innerHTML = svgMarkup;
                pieLegend.innerHTML = legendMarkup;
                chartTotalValue.textContent = '₹' + formatAmount(grandTotal);
            }

            // ===== RENDER =====
            function render() {
                currentMonthLabel.textContent = getCurrentMonthLabel();
                populateFilterOptions();
                filteredExpenses = getFiltered();

                const totalItems = filteredExpenses.length;
                const totalPages = Math.ceil(totalItems / ITEMS_PER_PAGE) || 1;
                if (currentPage >= totalPages) currentPage = totalPages - 1;
                if (currentPage < 0) currentPage = 0;

                const startIndex = currentPage * ITEMS_PER_PAGE;
                const endIndex = Math.min(startIndex + ITEMS_PER_PAGE, totalItems);
                const pageItems = filteredExpenses.slice(startIndex, endIndex);

                renderHero();
                renderTable(pageItems);
                renderFilterStats();
                renderPagination(totalItems, totalPages);
                renderPieChart();
            }

            function renderHero() {
                const total = filteredExpenses.reduce((s, e) => s + e.amount, 0);
                heroAmount.textContent = formatAmount(total);

                const cat = filterCategory.value;
                const month = filterMonth.value;
                const week = filterWeek.value;
                if (cat !== 'all' && month === 'all' && week === 'all') {
                    heroLabel.textContent = CATEGORY_NAMES[cat];
                } else if (month !== 'all' && week === 'all' && cat === 'all') {
                    heroLabel.textContent = getMonthLabel(month + '-01');
                } else if (week !== 'all' && month === 'all' && cat === 'all') {
                    heroLabel.textContent = 'Week ' + week.split('-W')[1];
                } else {
                    heroLabel.textContent = 'Total';
                }

                const today = todayStr();
                const weekExp = expenses.filter(e => isSameWeek(e.date, today));
                const monthExp = expenses.filter(e => isSameMonth(e.date, today));

                heroWeek.textContent = '₹' + formatAmount(weekExp.reduce((s, e) => s + e.amount, 0));
                heroMonth.textContent = '₹' + formatAmount(monthExp.reduce((s, e) => s + e.amount, 0));

                let avg = 0;
                if (filteredExpenses.length > 0) {
                    const dates = filteredExpenses.map(e => e.date).sort();
                    const first = new Date(dates[0] + 'T00:00:00');
                    const now = new Date();
                    const days = Math.max(1, Math.floor((now - first) / (1000 * 60 * 60 * 24)) + 1);
                    avg = total / days;
                }
                heroAvg.textContent = '₹' + formatAmount(avg);
            }

            function renderTable(pageItems) {
                if (pageItems.length === 0) {
                    expenseBody.innerHTML = `
                        <tr class="empty-row">
                            <td colspan="5">${expenses.length === 0 ? 'No expenses yet' : 'Nothing matches your filters'}</td>
                        </tr>
                    `;
                    return;
                }

                let html = '';
                for (const e of pageItems) {
                    const emoji = CATEGORY_EMOJIS[e.category] || '📌';
                    const catName = CATEGORY_NAMES[e.category] || e.category;
                    const desc = e.description || '';
                    const isEditing = (editingId === e.id);

                    if (isEditing) {
                        html += `
                            <tr class="edit-row" data-id="${e.id}">
                                <td colspan="5">
                                    <div class="edit-field">
                                        <input type="date" class="edit-date" value="${e.date}" />
                                        <select class="edit-category">
                                            ${Object.entries(CATEGORY_NAMES).map(([key, name]) =>
                                                `<option value="${key}" ${key === e.category ? 'selected' : ''}>${CATEGORY_EMOJIS[key]} ${name}</option>`
                                            ).join('')}
                                        </select>
                                        <input type="text" class="edit-description" value="${e.description || ''}" placeholder="Description" maxlength="60" />
                                        <input type="number" class="edit-amount" value="${e.amount}" step="0.01" min="0.01" inputmode="decimal" />
                                        <div class="edit-actions">
                                            <button class="save-edit-btn" data-id="${e.id}">Save</button>
                                            <button class="cancel-edit-btn" data-id="${e.id}">Cancel</button>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                        `;
                    } else {
                        html += `
                            <tr data-id="${e.id}">
                                <td class="date-cell">${formatDate(e.date)}</td>
                                <td class="category-cell">${emoji} ${catName}</td>
                                <td class="desc-cell" title="${desc}">${desc || '—'}</td>
                                <td class="amount-cell">₹${formatAmount(e.amount, 2)}</td>
                                <td class="actions-cell">
                                    <button class="action-btn edit-btn" data-id="${e.id}" title="Edit" aria-label="Edit">✏️</button>
                                    <button class="action-btn delete-btn" data-id="${e.id}" title="Delete" aria-label="Delete">✕</button>
                                </td>
                            </tr>
                        `;
                    }
                }
                expenseBody.innerHTML = html;

                document.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const id = this.dataset.id;
                        if (editingId === id) editingId = null;
                        deleteExpense(id);
                        currentPage = 0;
                        render();
                        showToast('Deleted', 'success');
                    });
                });

                document.querySelectorAll('.edit-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        editingId = this.dataset.id;
                        render();
                    });
                });

                document.querySelectorAll('.save-edit-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const id = this.dataset.id;
                        const row = this.closest('.edit-row');
                        const dateVal = row.querySelector('.edit-date').value;
                        const categoryVal = row.querySelector('.edit-category').value;
                        const descVal = row.querySelector('.edit-description').value;
                        const amountVal = parseFloat(row.querySelector('.edit-amount').value);

                        if (!dateVal) { showToast('Date is required', 'error'); return; }
                        if (!amountVal || amountVal <= 0) { showToast('Enter a valid amount', 'error'); return; }

                        if (updateExpense(id, amountVal, categoryVal, dateVal, descVal)) {
                            editingId = null;
                            render();
                            showToast('Updated', 'success');
                        }
                    });
                });

                document.querySelectorAll('.cancel-edit-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        editingId = null;
                        render();
                    });
                });

                document.querySelectorAll('.edit-row input, .edit-row select').forEach(el => {
                    el.addEventListener('keydown', function(e) {
                        if (e.key === 'Enter') {
                            const saveBtn = this.closest('.edit-row').querySelector('.save-edit-btn');
                            if (saveBtn) saveBtn.click();
                        } else if (e.key === 'Escape') {
                            const cancelBtn = this.closest('.edit-row').querySelector('.cancel-edit-btn');
                            if (cancelBtn) cancelBtn.click();
                        }
                    });
                });
            }

            function renderFilterStats() {
                const n = filteredExpenses.length;
                filterStats.textContent = `${n} item${n !== 1 ? 's' : ''}`;
            }

            function renderPagination(totalItems, totalPages) {
                if (totalItems === 0) {
                    pageInfo.textContent = '0 / 0';
                    prevPageBtn.disabled = true;
                    nextPageBtn.disabled = true;
                    return;
                }
                pageInfo.textContent = `${currentPage + 1} / ${totalPages}`;
                prevPageBtn.disabled = (currentPage === 0);
                nextPageBtn.disabled = (currentPage === totalPages - 1);
            }

            function populateFilterOptions() {
                const weekSet = new Set();
                for (const e of expenses) weekSet.add(getWeekKey(e.date));
                const weekKeys = Array.from(weekSet).sort();
                const prevWeekVal = filterWeek.value;

                filterWeek.innerHTML = '<option value="all">All weeks</option>';
                for (const wk of weekKeys) {
                    const label = getWeekLabelFromKey(wk);
                    filterWeek.innerHTML += `<option value="${wk}">${label}</option>`;
                }
                if (prevWeekVal === 'all' || filterWeek.querySelector(`option[value="${prevWeekVal}"]`)) {
                    filterWeek.value = prevWeekVal;
                } else if (weekKeys.length > 0) {
                    filterWeek.value = weekKeys[weekKeys.length - 1];
                } else {
                    filterWeek.value = 'all';
                }

                const monthSet = new Set();
                for (const e of expenses) monthSet.add(getMonthKey(e.date));
                const monthKeys = Array.from(monthSet).sort();
                const prevMonthVal = filterMonth.value;

                filterMonth.innerHTML = '<option value="all">All months</option>';
                for (const mk of monthKeys) {
                    const label = getMonthLabel(mk + '-01');
                    filterMonth.innerHTML += `<option value="${mk}">${label}</option>`;
                }
                if (prevMonthVal === 'all' || filterMonth.querySelector(`option[value="${prevMonthVal}"]`)) {
                    filterMonth.value = prevMonthVal;
                } else if (monthKeys.length > 0) {
                    filterMonth.value = monthKeys[monthKeys.length - 1];
                } else {
                    filterMonth.value = 'all';
                }
            }

            // ===== TOAST =====
            let toastTimeout = null;

            function showToast(msg, type = '') {
                toast.textContent = msg;
                toast.className = 'toast ' + type;
                void toast.offsetWidth;
                toast.classList.add('show');
                clearTimeout(toastTimeout);
                toastTimeout = setTimeout(() => {
                    toast.classList.remove('show');
                }, 2200);
            }

            // ===== FORM SUBMIT =====
            form.addEventListener('submit', function(e) {
                e.preventDefault();

                const amount = parseFloat(amountInput.value);
                if (!amount || amount <= 0) {
                    showToast('Enter a valid amount', 'error');
                    amountInput.focus();
                    return;
                }

                const category = categorySelect.value;
                const date = dateInput.value;
                if (!date) {
                    showToast('Select a date', 'error');
                    dateInput.focus();
                    return;
                }

                const description = descInput.value.trim();
                addExpense(amount, category, date, description);

                amountInput.value = '';
                descInput.value = '';
                dateInput.value = todayStr();
                amountInput.focus();

                currentPage = 0;
                render();
                showToast('Added', 'success');
            });

            // ===== PAGINATION =====
            prevPageBtn.addEventListener('click', function() {
                if (currentPage > 0) {
                    currentPage--;
                    render();
                }
            });

            nextPageBtn.addEventListener('click', function() {
                const totalPages = Math.ceil(filteredExpenses.length / ITEMS_PER_PAGE) || 1;
                if (currentPage < totalPages - 1) {
                    currentPage++;
                    render();
                }
            });

            // ===== FILTER CHANGE =====
            filterCategory.addEventListener('change', () => { currentPage = 0; editingId = null; render(); });
            filterWeek.addEventListener('change', () => { currentPage = 0; editingId = null; render(); });
            filterMonth.addEventListener('change', () => { currentPage = 0; editingId = null; render(); });

            // ===== CLEAR FILTERS =====
            clearFiltersBtn.addEventListener('click', function() {
                filterCategory.value = 'all';
                const weekOpts = filterWeek.querySelectorAll('option');
                filterWeek.value = weekOpts.length > 1 ? weekOpts[weekOpts.length - 1].value : 'all';
                const monthOpts = filterMonth.querySelectorAll('option');
                filterMonth.value = monthOpts.length > 1 ? monthOpts[monthOpts.length - 1].value : 'all';
                currentPage = 0;
                editingId = null;
                render();
                showToast('Filters reset', 'success');
            });

            // ===== RESET ALL =====
            resetBtn.addEventListener('click', resetAll);

            // ===== SERVICE WORKER =====
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('/sw.js?v=6')
                        .then(reg => { console.log('SW registered'); reg.update(); })
                        .catch(err => console.log('SW failed:', err));
                });
            }

            // ===== INIT =====
            function init() {
                loadData();
                dateInput.value = todayStr();
                currentMonthLabel.textContent = getCurrentMonthLabel();
                populateFilterOptions();
                filteredExpenses = getFiltered();
                render();
            }

            init();
        })();
    </script>
</body>
</html>
